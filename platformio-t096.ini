[platformio]
boards_dir = boards

[env:t096-client]
platform = nordicnrf52@10.10.0
board = heltec_t096
upload_speed = 115200
framework = arduino
board_build.variants_dir = variants
extra_scripts = pre:tools/load_rf_profile.py
custom_rf_group = B
build_unflags = -std=gnu++11
build_flags =
 -Wall
 -Wextra
 -std=gnu++17
	-D ARDUINO_NRF52_ADAFRUIT
lib_deps =
	jgromes/RadioLib @ 7.8.1
	adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0
	adafruit/Adafruit GFX Library @ 1.12.6
	adafruit/Adafruit BusIO @ 1.17.4
	adafruit/Adafruit seesaw Library @ 1.7.9
	arduino-libraries/SD @ 1.3.0
build_src_filter =
	+<t096_client.cpp>
