; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 預設 build client/station；GPS / UART 獨立模式整合於 station。
default_envs = tbeam-client, tbeam-station

; 兩塊板共用的設定。刻意放在 [esp32_base] 而不是 [env]：[env] 會套用到「所有」
; environment，包含 env:native，那樣 native 測試就會被塞進 ESP32 的 platform 與
; lib_deps。
[esp32_base]
; 版本鎖定。程式裡有 #if ESP_ARDUINO_VERSION_MAJOR >= 3 的分支（servo 的 LEDC API
; 在 2.x/3.x 之間換過），不鎖的話某天 pio 自動更新就會靜悄悄換一條路走 —— 而 servo
; 是這台機器上唯一的機構致動器。
platform = espressif32@55.3.39
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.psram_type = qspi
upload_speed = 921600
monitor_speed = 115200
; Use chain instead of chain+ for newer arduino-esp32 builds so transitive headers
; like WiFi -> Network.h are resolved reliably during linking.
lib_ldf_mode = chain
; 角色是用 build flag 分的，很容易出現「只在另一個 role 才會爆」的問題，
; 編譯器警告是最便宜的防線。
build_flags =
	-Wall
	-Wextra
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
lib_deps =
	jgromes/RadioLib @ ^7.1.2
	mikalhart/TinyGPSPlus @ ^1.1.0
	lewisxhe/XPowersLib @ ^0.2.8
	olikraus/U8g2 @ ^2.35.30
	adafruit/Adafruit BME280 Library @ ^2.3.0
	adafruit/Adafruit Unified Sensor @ ^1.1.15

; 註：下面兩個 upload_port 是「兩塊板同時插著」時的慣例。只插一塊時它會拿到
; /dev/ttyACM0，這時用 `pio run -e tbeam-client -t upload --upload-port /dev/ttyACM0`
; 覆蓋即可，不必改這個檔。
[env:tbeam-client]
extends = esp32_base
; Windows:
;   upload_port = COM7
;   monitor_port = COM7
; Linux:
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1

build_flags =
	${esp32_base.build_flags}
	-D ROLE_CLIENT

[env:tbeam-station]
extends = esp32_base
; Windows:
;   upload_port = COM8
;   monitor_port = COM8
; Linux:
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

build_flags =
	${esp32_base.build_flags}
	-D ROLE_STATION

; Wi-Fi upload for a STATION that already runs OTA-capable firmware.
; Keep the normal tbeam-station environment above for the first USB flash and
; recovery. OTA has no application-level password; hotspot access is the only
; network protection.
[env:tbeam-station-ota]
extends = env:tbeam-station
upload_protocol = espota
upload_port = 192.168.31.9
; ESP opens a TCP connection back to the uploader. Use a fixed port so ChromeOS
; can forward it into the Crostini Linux container.
upload_flags =
	--host_port=3233

; Field diagnostics use a 1 Hz RMC/GGA baseline and internal-flash evidence.
; Normal Client/Station builds above retain their 2 Hz validation setting.
[env:tbeam-client-diagnostic]
extends = env:tbeam-client
build_flags =
	${env:tbeam-client.build_flags}
	-D FIELD_DIAGNOSTIC

[env:tbeam-station-diagnostic]
extends = env:tbeam-station
build_flags =
	${env:tbeam-station.build_flags}
	-D FIELD_DIAGNOSTIC

; Full-trip Client recording: same 1 Hz comparison baseline, continuous RF/SD,
; raw UART on SD and sparse power/health evidence in internal Flash.
[env:tbeam-client-trip]
extends = env:tbeam-client-diagnostic
build_flags =
	${env:tbeam-client-diagnostic.build_flags}
	-D CLIENT_TRIP_LOG

; 筆電上跑的單元測試：`pio test -e native`。
;
; 純邏輯測試：角度/方位/圓擬合、電量/提醒、GPS/UART 模式隔離、共用限速與 UART watchdog。
; geo_math、alerts、tracking_policy、servo_motion 都不依賴 Arduino。
[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-I include
	; computeBearing / equirectDistanceM 回傳 double，Unity 預設關閉 double 斷言。
	-D UNITY_INCLUDE_DOUBLE
