; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.psram_type = qspi
upload_speed = 921600
monitor_speed = 115200
; Use chain instead of chain+ for newer arduino-esp32 builds so transitive headers
; like WiFi -> Network.h are resolved reliably during linking.
lib_ldf_mode = chain
lib_deps =
	jgromes/RadioLib @ ^7.1.2
	mikalhart/TinyGPSPlus @ ^1.1.0
	lewisxhe/XPowersLib @ ^0.2.8
	olikraus/U8g2 @ ^2.35.30
	adafruit/Adafruit BME280 Library @ ^2.3.0
	adafruit/Adafruit Unified Sensor @ ^1.1.15
	lewisxhe/SensorLib @ ^0.4.1

[env:tbeam-client]
extends = env
; Windows:
;   upload_port = COM7
;   monitor_port = COM7
; Linux:
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1

build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D ROLE_CLIENT

[env:tbeam-server]
extends = env
; Windows:
;   upload_port = COM8
;   monitor_port = COM8
; Linux:
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D ROLE_SERVER

; Wi-Fi upload for a SERVER that already runs OTA-capable firmware.
; Keep the normal tbeam-server environment above for the first USB flash and
; recovery. OTA has no application-level password; hotspot access is the only
; network protection.
[env:tbeam-server-ota]
extends = env:tbeam-server
upload_protocol = espota
upload_port = 192.168.31.9
; ESP opens a TCP connection back to the uploader. Use a fixed port so ChromeOS
; can forward it into the Crostini Linux container.
upload_flags =
	--host_port=3233
